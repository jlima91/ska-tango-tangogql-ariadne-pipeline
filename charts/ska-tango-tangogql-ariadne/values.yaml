# Default values for taranta.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

display: ":0"
xauthority: "~/.Xauthority"

basename: true
tangoDB: taranta

# Prefer a per-instance Tango host if set; chart templates fall back to global.tango_host.
# Leave empty here; set it per instance from the parent chart.
tango_host: ""

logging:
  level: DEBUG

global:
  minikube: false
  no_auth: false
  tango_host: databaseds-tango-base:10000
  attribute_client_queue_limit: 1501
  attribute_global_queue_limit: 5001

  oidc_issuer: entra

  msentra_tenant_id: 78887040-bad7-494b-8760-88dcacfb3805
  msentra_api_id: 27f76d0a-79d7-443e-8718-5a38438f9eed
  msentra_read_access: READ
  msentra_readwrite_access: READWRITE

  iams_authority: https://iam-1.staging.devx.skao.int
  iams_client_id: e36f1b40-1b9d-431c-a5d3-bd3caf7ee1e5
  iams_api_audience: test:icams
  iams_require_audience: true
  iams_read_group: app:tangogql_ariadne:readers
  iams_readwrite_group: app:tangogql_ariadne:writers

  operator: true
  cluster_domain: cluster.local

tangogql:
  image:
    registry: artefact.skao.int
    image: ska-tango-tangogql-ariadne
    tag: 1.1.2
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 600m # 600m = 0.6 CPU
      memory: 512Mi # 512Mi = 0.5 GB mem
    limits:
      cpu: 1000m # 1000m = 1 CPU
      memory: 1024Mi # 1024Mi = 1 GB mem

itango:
  image:
    registry: artefact.skao.int
    image: ska-tango-images-tango-itango
    tag: 10.1.2
    pullPolicy: IfNotPresent

ska-tango-base:
  enabled: true

# Configure Ingress resource that allow you to access the Tango REST API
ingress:
  enabled: true

  # Ingress annotations
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1

  # Ingress class
  ingressClassName: nginx

  # Ingress host
  #
  # Leave empty to bind to '*'.
  host: ""

  # Ingress TLS configuration
  #
  # Example:
  # tls:
  #   - secretName: ska-tango-taranta-tls
  #     hosts:
  #       - tango.example.com
  tls: []

nodeSelector: {}

affinity: {}
tolerations: []
